
name: DietLife CI-CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar build
        run: npm run build

      - name: Executar testes automatizados
        run: npm test

      - name: Gerar artefato de entrega
        uses: actions/upload-artifact@v6
        with:
          name: dietlife-build
          path: dist/
          if-no-files-found: error
